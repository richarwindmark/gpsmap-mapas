<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GPSMap 3D</title>
<link rel="stylesheet" href="maplibre-gl.css">
<script src="maplibre-gl.js"></script>
<style>
  :root { --pine: #1F6F4A; --route: #F2C230; --ink: #14201A; }
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #cfe3f0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* el mapa ocupa siempre toda la ventana, pase lo que pase con el tamaño inicial del visor */
  #map { position: fixed !important; top: 0; left: 0; right: 0; bottom: 0; }
  .panel { position: absolute; background: rgba(255,255,255,.96); border-radius: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,.18); color: var(--ink); }
  #top { position: absolute; z-index: 5; top: 12px; left: 12px; display: flex; gap: 8px; }
  .panel { z-index: 4; }
  .btn { border: 0; background: #fff; color: var(--ink); border-radius: 14px; padding: 10px 14px; font-size: 15px;
    font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.18); cursor: pointer; }
  .btn.on { background: var(--pine); color: #fff; }
  #bar { left: 12px; right: 12px; bottom: 34px; padding: 12px 16px; display: none; align-items: center; gap: 14px; }
  #play { width: 52px; height: 52px; border-radius: 26px; border: 0; background: var(--route); color: #2b2410;
    font-size: 22px; cursor: pointer; flex: none; box-shadow: 0 3px 10px rgba(180,140,20,.45); }
  #speed { flex: none; }
  .zoomf { flex: none; width: 40px; padding: 8px 0; font-size: 20px; line-height: 1; }
  #prog { flex: 1; accent-color: var(--route); height: 28px; }
  #info { flex: none; min-width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
  #info b { font-size: 17px; }
  #info span { display: block; font-size: 12px; color: #4a574f; }
  #title { top: 70px; left: 12px; padding: 10px 14px; max-width: 70%; display: none; }
  /* resumen al terminar el recorrido: aparece con un fundido */
  #summary { left: 50%; top: 50%; transform: translate(-50%, -46%); width: min(88vw, 420px); padding: 18px 20px 16px;
    opacity: 0; pointer-events: none; transition: opacity .9s ease, transform .9s ease; z-index: 6; }
  #summary.on { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  #summary > b { display: block; font-size: 19px; margin-bottom: 10px; color: var(--pine); }
  #summary .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; margin-bottom: 14px; }
  #summary .grid span { display: block; font-size: 11px; color: #4a574f; }
  #summary .grid b { font-size: 17px; font-variant-numeric: tabular-nums; }
  @media (max-width: 420px) { #summary .grid { grid-template-columns: repeat(2, 1fr); } }
  #title b { display: block; font-size: 16px; }
  #title span { font-size: 13px; color: #4a574f; font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) {
    #info { min-width: 0; } #info b { font-size: 14px; } #bar { gap: 8px; padding: 8px 10px; left: 8px; right: 8px; }
    #play { width: 46px; height: 46px; font-size: 19px; } #speed { padding: 8px 10px; }
    #top .btn { padding: 8px 11px; font-size: 14px; } #title { top: 62px; }
  }
  .maplibregl-ctrl-attrib { font-size: 10px; }
  .runner { width: 18px; height: 18px; border-radius: 50%; background: var(--route); border: 3px solid #fff;
    box-shadow: 0 0 0 7px rgba(255,90,31,.28), 0 2px 6px rgba(0,0,0,.35); }
  /* los creditos van por encima de la barra de reproduccion */
  body.has-route .maplibregl-ctrl-bottom-right { bottom: 112px; }
  /* video de la ruta */
  #render { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(88vw, 420px); padding: 18px 20px 16px; display: none; z-index: 7; }
  #render > b { display: block; font-size: 19px; margin-bottom: 8px; color: var(--pine); }
  #render #rtext { font-size: 14px; color: #3c4740; margin-bottom: 12px; line-height: 1.35; }
  #render #rstatus { font-size: 14px; margin: 8px 0 12px; min-height: 18px; }
  #rprog { height: 10px; background: #e6e9e7; border-radius: 5px; overflow: hidden; }
  #rbar { height: 100%; width: 0; background: var(--route); transition: width .3s; }
  .rbtns { display: flex; gap: 8px; }
  /* mientras se crea el video: solo el panel de progreso (lo demas no sale en el video, pero estorba) */
  body.rendering #top, body.rendering #bar, body.rendering #title, body.rendering #summary,
  body.rendering .maplibregl-ctrl-top-right, body.rendering .maplibregl-ctrl-bottom-right { display: none !important; }
  body.rendering #render { top: auto; bottom: 20px; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <button class="btn" id="close">✕ Salir</button>
  <button class="btn on" id="sat">Satélite</button>
  <button class="btn" id="topo">Topográfico</button>
  <button class="btn" id="video" style="display:none">🎬 Vídeo</button>
</div>
<div class="panel" id="title"><b id="tname"></b><span id="tstats"></span></div>
<div class="panel" id="summary">
  <b id="sname"></b>
  <div class="grid">
    <div><span>Distancia</span><b id="sdist"></b></div>
    <div><span>Desnivel +</span><b id="sgain"></b></div>
    <div><span>Desnivel −</span><b id="sloss"></b></div>
    <div><span>Tiempo estimado</span><b id="stime"></b></div>
    <div><span>Altitud máx.</span><b id="smax"></b></div>
    <div><span>Altitud mín.</span><b id="smin"></b></div>
  </div>
  <button class="btn" id="sagain">↻ Ver de nuevo</button>
</div>
<div class="panel" id="bar">
  <button id="play" title="Reproducir recorrido">▶</button>
  <button class="btn" id="speed">x1</button>
  <button class="btn zoomf" id="zout" title="Alejar la cámara">−</button>
  <button class="btn zoomf" id="zin" title="Acercar la cámara">+</button>
  <input id="prog" type="range" min="0" max="1000" value="0">
  <div id="info"><b id="idist">0 km</b><span id="iele"></span></div>
</div>
<script>
const origin = location.origin;
const isAndroid = /Android/i.test(navigator.userAgent);
// Version web: la pagina va dentro de la app (iframe) y le pide a ella la configuracion y los mapas
const bridge = (window.parent !== window && window.parent.gpsmap3d) || null;
if (bridge) maplibregl.addProtocol('gpsmap', async (params) => {
  const data = await bridge.serve(params.url.substring('gpsmap://'.length));
  if (!data) throw new Error('No encontrado (404): ' + params.url);
  return { data };
});
const base = bridge ? 'gpsmap://' : origin + '/';
let map, cfg, route = null, cum = [], total = 0;
let playing = false, speed = 1, t = 0, lastTs = 0, bearing = null;

const fmtKm = m => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km';

function prepareStyle(text) {
  const s = JSON.parse(bridge ? text : text.split('gpsmap://').join(origin + '/'));
  // fuente propia para el relieve 3D (separada del sombreado, como recomienda MapLibre)
  s.sources['terrain-dem'] = { type: 'raster-dem', tiles: [base + 'tiles/dem/{z}/{x}/{y}'],
    tileSize: 512, maxzoom: 11, encoding: 'terrarium' };
  s.terrain = { source: 'terrain-dem', exaggeration: 1.35 };
  // En los moviles Android el cielo de MapLibre puede tapar toda la pantalla (fallo conocido):
  // alli se usa el color de fondo de la pagina como cielo
  if (!isAndroid) s.sky = { 'sky-color': '#8fc3ea', 'horizon-color': '#e6f0f7', 'fog-color': '#ffffff',
    'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.6, 'fog-ground-blend': 0.2, 'atmosphere-blend': 0.8 };
  return s;
}

// Colores del recorrido: amarillo claro con borde oscuro (se lee sobre satelite y topografico)
const TRAIL = '#FFE066', TRAIL_EDGE = 'rgba(30,30,20,0.55)';
// Ruta completa (vista general) y rastro que va dejando el punto al reproducir (misma linea, se muestra
// solo hasta donde ha llegado con un degradado sobre el progreso: no se recalcula la geometria en cada imagen)
function addRoute() {
  if (!route || map.getSource('route')) return;
  map.addSource('route', { type: 'geojson', lineMetrics: true, data: { type: 'Feature', geometry: { type: 'LineString', coordinates: route.map(p => [p[0], p[1]]) } } });
  map.addLayer({ id: 'route-casing', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': TRAIL_EDGE, 'line-width': 6.5 } });
  map.addLayer({ id: 'route-line', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': TRAIL, 'line-width': 3.5 } });
  map.addSource('runner', { type: 'geojson', data: runnerData(route[0]) });
  // el punto: pequeño, amarillo, con halo suave (dibujado por el mapa: se mueve sin temblar)
  map.addLayer({ id: 'runner-halo', type: 'circle', source: 'runner', paint: { 'circle-radius': 13, 'circle-color': TRAIL, 'circle-opacity': 0.28, 'circle-blur': 0.6, 'circle-pitch-alignment': 'map' } });
  map.addLayer({ id: 'runner-dot', type: 'circle', source: 'runner', paint: { 'circle-radius': 5.5, 'circle-color': TRAIL, 'circle-stroke-color': '#2b2b1f', 'circle-stroke-width': 1.5, 'circle-pitch-alignment': 'map' } });
  showProgress(trailProgress);
}
function runnerData(p) { return { type: 'Feature', geometry: { type: 'Point', coordinates: [p[0], p[1]] } }; }
// progreso del rastro (0..1); null = ruta completa visible (antes de reproducir)
let trailProgress = null;
function showProgress(f) {
  trailProgress = f;
  if (!map || !map.getLayer('route-line')) return;
  if (f == null) {
    map.setPaintProperty('route-line', 'line-gradient', null); map.setPaintProperty('route-line', 'line-color', TRAIL);
    map.setPaintProperty('route-casing', 'line-gradient', null); map.setPaintProperty('route-casing', 'line-color', TRAIL_EDGE);
    return;
  }
  const v = Math.max(0.00001, Math.min(1, f));
  if (v >= 1) { showProgress(null); return; }
  map.setPaintProperty('route-line', 'line-gradient', ['step', ['line-progress'], TRAIL, v, 'rgba(0,0,0,0)']);
  map.setPaintProperty('route-casing', 'line-gradient', ['step', ['line-progress'], TRAIL_EDGE, v, 'rgba(0,0,0,0)']);
}

function hav(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

// posicion (lon, lat, alt) a una distancia d del inicio
function at(d) {
  if (!route) return [0, 0, null];
  d = Math.max(0, Math.min(total, d));
  let lo = 1, hi = cum.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < d) lo = m + 1; else hi = m; }
  const a = route[lo - 1], b = route[lo], seg = (cum[lo] - cum[lo - 1]) || 1, k = (d - cum[lo - 1]) / seg;
  const ele = (a[2] != null && b[2] != null) ? a[2] + (b[2] - a[2]) * k : (a[2] ?? b[2]);
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, ele];
}

function brg(a, b) {
  const r = Math.PI / 180, y = Math.sin((b[0] - a[0]) * r) * Math.cos(b[1] * r);
  const x = Math.cos(a[1] * r) * Math.sin(b[1] * r) - Math.sin(a[1] * r) * Math.cos(b[1] * r) * Math.cos((b[0] - a[0]) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}

// punto a una distancia (m) y rumbo (grados) de otro
function dest(p, b, dist) {
  const R = 6371000, r = Math.PI / 180, d = dist / R, th = b * r, la = p[1] * r, lo = p[0] * r;
  const la2 = Math.asin(Math.sin(la) * Math.cos(d) + Math.cos(la) * Math.sin(d) * Math.cos(th));
  const lo2 = lo + Math.atan2(Math.sin(th) * Math.sin(d) * Math.cos(la), Math.cos(d) - Math.sin(la) * Math.sin(la2));
  return [lo2 / r, la2 / r];
}

function duration() { return Math.min(150000, Math.max(25000, total / 1000 * 6000)) / speed; }

// Rumbo de la camara precalculado a lo largo de la ruta (cada 10 m) y muy suavizado: sigue la
// direccion general del camino, no cada zigzag, asi la camara no da bandazos de lado a lado.
let camBrg = [];
const CAM_STEP = 10;
function buildCameraPath() {
  camBrg = [];
  if (!route) return;
  const n = Math.max(2, Math.ceil(total / CAM_STEP) + 1);
  let prev = null;
  const raw = [];
  for (let i = 0; i < n; i++) {
    const d = i * CAM_STEP;
    // direccion de la cuerda entre 200 m atras y 600 m adelante
    let b = brg(at(d - 200), at(d + 600));
    if (prev != null) { while (b - prev > 180) b -= 360; while (b - prev < -180) b += 360; }
    raw.push(b); prev = b;
  }
  // media movil gaussiana de ~±500 m
  const sigma = 250 / CAM_STEP, w = Math.ceil(sigma * 2);
  const k = []; for (let j = -w; j <= w; j++) k.push(Math.exp(-(j * j) / (2 * sigma * sigma)));
  for (let i = 0; i < n; i++) {
    let s = 0, ks = 0;
    for (let j = -w; j <= w; j++) { const v = raw[Math.min(n - 1, Math.max(0, i + j))]; s += v * k[j + w]; ks += k[j + w]; }
    camBrg.push(s / ks);
  }
}
function camBearingAt(d) {
  if (!camBrg.length) return 0;
  const f = Math.max(0, Math.min(camBrg.length - 1, d / CAM_STEP)), i = Math.floor(f), j = Math.min(camBrg.length - 1, i + 1);
  return camBrg[i] + (camBrg[j] - camBrg[i]) * (f - i);
}

// ---- Camara de seguimiento (como un dron detras del punto) ----
// Se coloca a FOLLOW metros del punto, detras y por encima (unos 32 grados), mirandolo. Todo va suavizado
// en el tiempo (punto, rumbo, altura), asi no copia cada zigzag del camino ni los saltos del relieve.
// Con − y + se aleja o se acerca.
let follow = 3600;                 // distancia de la camara al punto (m)
const ELEV = 32 * Math.PI / 180;   // angulo desde el que se mira
const EXAG = 1.35;                 // exageracion del relieve (la misma que en prepareStyle)
let camT = null;                   // punto al que mira la camara (suavizado): [lon, lat, alt]
let camAlt = null;                 // altura de la camara (suavizada)

// altura del relieve dibujado en un punto (con exageracion); si aun no ha cargado, la de la ruta
function groundAt(lon, lat, fallback) {
  const h = map.queryTerrainElevation ? map.queryTerrainElevation([lon, lat]) : null;
  return h != null ? h : (fallback != null ? fallback * EXAG : 0);
}

// Altura minima de la camara (en [cam]) para ver el punto [tgt] por encima del relieve que hay en medio
function clearSight(cam, tgt) {
  let need = 0;
  for (let i = 1; i < 12; i++) {
    const s = i / 12;  // 0 = camara, 1 = punto
    const lon = cam[0] + (tgt[0] - cam[0]) * s, lat = cam[1] + (tgt[1] - cam[1]) * s;
    const h = groundAt(lon, lat, null);
    if (!h) continue;
    // la linea de vision a esa altura debe pasar 60 m por encima del terreno
    need = Math.max(need, (h + 60 - tgt[2] * s) / (1 - s));
  }
  return need;
}

let sightNeed = 0, sightAt = null;
function placeCamera(dt) {
  const d = t / duration() * total;
  const p = at(d);
  const pAlt = groundAt(p[0], p[1], p[2]);
  const targetBrg = camBearingAt(d);
  if (camT == null || !dt) {
    camT = [p[0], p[1], pAlt]; bearing = targetBrg; camAlt = null;
  } else {
    // el punto que se mira va un poco por detras del real: movimiento de camara suave
    const kp = 1 - Math.exp(-dt / 450);
    camT[0] += (p[0] - camT[0]) * kp; camT[1] += (p[1] - camT[1]) * kp; camT[2] += (pAlt - camT[2]) * (1 - Math.exp(-dt / 900));
    // giro lento y continuo
    let b = targetBrg; while (b - bearing > 180) b -= 360; while (b - bearing < -180) b += 360;
    bearing += (b - bearing) * (1 - Math.exp(-dt / 1400));
  }
  const back = dest([camT[0], camT[1]], (bearing + 180) % 360, follow * Math.cos(ELEV));
  // nunca por debajo de las montañas que haya donde esta la camara (con margen)...
  let want = Math.max(camT[2] + follow * Math.sin(ELEV), groundAt(back[0], back[1], null) + 180);
  // ...y que ninguna montaña entre la camara y el punto lo tape: se sube lo justo para verlo (con margen)
  // (se calcula 4 veces por segundo, no en cada imagen: consulta mucho el relieve)
  const nowMs = performance.now();
  if (!dt || sightAt == null || nowMs - sightAt > 250) { sightNeed = clearSight(back, camT); sightAt = nowMs; }
  want = Math.max(want, sightNeed);
  camAlt = camAlt == null || !dt ? want : camAlt + (want - camAlt) * (1 - Math.exp(-dt / (want > camAlt ? 500 : 1500)));
  const opts = map.calculateCameraOptionsFromTo(new maplibregl.LngLat(back[0], back[1]), camAlt, new maplibregl.LngLat(camT[0], camT[1]), camT[2]);
  map.jumpTo(opts);
}

function update(d, moveCamera, dt) {
  const p = at(d);
  const src = map && map.getSource('runner');
  if (src) src.setData(runnerData(p));
  if (trailProgress != null || playing) showProgress(d / total);
  document.getElementById('idist').textContent = fmtKm(d) + ' / ' + fmtKm(total);
  document.getElementById('iele').textContent = p[2] != null ? Math.round(p[2]) + ' m de altitud' : '';
  document.getElementById('prog').value = Math.round(d / total * 1000);
  if (moveCamera) placeCamera(dt);
}

function frame(ts) {
  if (!playing) return;
  // pausas largas (pestaña oculta, carga) no provocan saltos
  const dt = lastTs ? Math.min(60, ts - lastTs) : 16;
  lastTs = ts;
  t = Math.min(duration(), t + dt);
  update(t / duration() * total, true, dt);
  if (t >= duration()) { setPlaying(false); showSummary(); return; }
  requestAnimationFrame(frame);
}

function setPlaying(on) {
  playing = on;
  document.getElementById('play').textContent = on ? '❚❚' : '▶';
  if (on) {
    if (t >= duration()) { t = 0; camT = null; }
    lastTs = 0;
    if (camT == null) {
      // primera vez: el rastro empieza vacio y la camara vuela suave hasta detras del punto
      showProgress(t / duration() * total / total);
      const d = t / duration() * total, p = at(d), b = camBearingAt(d), pAlt = groundAt(p[0], p[1], p[2]);
      const back = dest([p[0], p[1]], (b + 180) % 360, follow * Math.cos(ELEV));
      const alt = Math.max(pAlt + follow * Math.sin(ELEV), groundAt(back[0], back[1], null) + 180, clearSight(back, [p[0], p[1], pAlt]));
      const opts = map.calculateCameraOptionsFromTo(new maplibregl.LngLat(back[0], back[1]), alt, new maplibregl.LngLat(p[0], p[1]), pAlt);
      map.easeTo(Object.assign({}, opts, { duration: 2000, easing: x => x * x * (3 - 2 * x) }));
      map.once('moveend', () => { camT = [p[0], p[1], pAlt]; bearing = b; camAlt = alt; if (playing) requestAnimationFrame(frame); });
      return;
    }
    requestAnimationFrame(frame);
  }
}

// − / + : alejar o acercar la camara del recorrido (tambien en pausa)
function zoomFollow(f) {
  follow = Math.max(700, Math.min(9000, follow * f));
  if (!playing && camT != null) placeCamera(0);
}

function useStyle(which) {
  document.getElementById('sat').classList.toggle('on', which === 'sat');
  document.getElementById('topo').classList.toggle('on', which === 'topo');
  const cam = { center: map.getCenter(), zoom: map.getZoom(), bearing: map.getBearing(), pitch: map.getPitch() };
  map.setStyle(prepareStyle(which === 'sat' ? cfg.satellite : cfg.topo));
  map.once('styledata', () => { map.jumpTo(cam); });
}

function init(c) {
  cfg = c;
  if (c.route && c.route.length > 1) {
    route = c.route;
    cum = [0];
    for (let i = 1; i < route.length; i++) cum.push(cum[i - 1] + hav(route[i - 1], route[i]));
    total = cum[cum.length - 1];
    buildCameraPath();
  }
  map = new maplibregl.Map({
    container: 'map', style: prepareStyle(c.satellite), center: c.center, zoom: Math.max(c.zoom, 11.5),
    pitch: 62, maxPitch: 85, attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true, showZoom: true }), 'top-right');
  map.on('style.load', addRoute);
  // reproduciendo: la rueda del raton (o el pellizco) acerca/aleja la camara de seguimiento
  map.getCanvasContainer().addEventListener('wheel', e => {
    if (!playing) return;
    e.preventDefault(); e.stopPropagation();
    zoomFollow(e.deltaY > 0 ? 1.12 : 1 / 1.12);
  }, { passive: false, capture: true });
  // el mapa siempre se ajusta al tamaño real de la ventana (en algunos moviles el visor cambia de tamaño al abrirse)
  const fit = () => map && map.resize();
  addEventListener('resize', fit);
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  new ResizeObserver(() => {
    fit();
    const m = document.getElementById('map');
    console.info('estado3d: tamaño ' + m.clientWidth + 'x' + m.clientHeight + ' ventana ' + innerWidth + 'x' + innerHeight +
      ' lienzo ' + map.getCanvas().width + 'x' + map.getCanvas().height);
  }).observe(document.body);
  [300, 1000, 2500].forEach(ms => setTimeout(fit, ms));
  map.on('load', () => {
    if (route) {
      const b = route.reduce((bb, p) => bb.extend([p[0], p[1]]), new maplibregl.LngLatBounds([route[0][0], route[0][1]], [route[0][0], route[0][1]]));
      map.fitBounds(b, { padding: 70, pitch: 60, bearing: brg(route[0], route[route.length - 1]), duration: 1600 });
      document.getElementById('bar').style.display = 'flex';
      document.body.classList.add('has-route');
      // en pantallas estrechas los creditos se quedan plegados en el boton "i"
      if (innerWidth < 700) { const a = document.querySelector('.maplibregl-ctrl-attrib'); a && a.classList.remove('maplibregl-compact-show'); }
      document.getElementById('title').style.display = 'block';
      document.getElementById('tname').textContent = c.name || 'Ruta';
      document.getElementById('tstats').textContent = fmtKm(total) + (c.gain != null ? ' · ↑ ' + Math.round(c.gain) + ' m' : '');
      update(0, false);
      // video de la ruta: boton siempre; y el panel abierto si se pidio "Crear video de la ruta"
      document.getElementById('video').style.display = '';
      document.getElementById('video').onclick = () => openRenderPanel();
      if (c.render) map.once('moveend', () => openRenderPanel());
      // "Reproducir en 3D": al terminar el encuadre y cargar el relieve, arranca desde el inicio
      if (c.autoplay) map.once('moveend', () => map.once('idle', () => {
        t = 0; camT = null; setPlaying(true);
      }));
    }
    map.once('idle', checkRender);
  });
}

// Comprueba que el relieve se ha dibujado de verdad (y lo deja en el registro de la app).
// Si en la mitad inferior de la pantalla solo hay "cielo", se quita el relieve y se ve el mapa inclinado.
let renderChecked = false;
function checkRender() {
  if (renderChecked) return;
  map.once('render', () => { try { inspectRender(); } catch (e) { console.warn('estado3d: ' + e); } });
  map.triggerRepaint();
}
function inspectRender() {
  {
    renderChecked = true;
    const gl = map.painter.context.gl, cv = map.getCanvas();
    const px = new Uint8Array(4);
    let blank = 0, n = 0;
    for (const fx of [0.25, 0.5, 0.75]) for (const fy of [0.15, 0.3]) {
      gl.readPixels(Math.floor(cv.width * fx), Math.floor(cv.height * fy), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      n++;
      const skyish = px[3] < 10 || (px[2] > 200 && px[2] > px[0] + 30 && px[1] > 170) || (px[0] > 225 && px[1] > 225 && px[2] > 225);
      if (skyish) blank++;
    }
    let info = '';
    try { const dbg = gl.getExtension('WEBGL_debug_renderer_info'); info = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : ''; } catch (e) {}
    console.info('estado3d: gpu=' + info + ' webgl2=' + (typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext) +
      ' lienzo=' + cv.width + 'x' + cv.height + ' zoom=' + map.getZoom().toFixed(1) + ' pitch=' + map.getPitch().toFixed(0) +
      ' vacios=' + blank + '/' + n + ' terreno=' + !!map.getTerrain());
  }
}

// Resumen de la ruta al terminar el recorrido (fundido de entrada)
function fmtDur(ms) { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
function showSummary() {
  const s = cfg && cfg.summary;
  if (!s) return;
  document.getElementById('sname').textContent = cfg.name || 'Ruta';
  document.getElementById('sdist').textContent = fmtKm(s.distance);
  document.getElementById('sgain').textContent = Math.round(s.gain) + ' m';
  document.getElementById('sloss').textContent = Math.round(s.loss) + ' m';
  document.getElementById('stime').textContent = fmtDur(s.time);
  document.getElementById('smax').textContent = s.maxEle != null ? Math.round(s.maxEle) + ' m' : '—';
  document.getElementById('smin').textContent = s.minEle != null ? Math.round(s.minEle) + ' m' : '—';
  // vista general de toda la ruta detras del resumen
  const b = route.reduce((bb, p) => bb.extend([p[0], p[1]]), new maplibregl.LngLatBounds([route[0][0], route[0][1]], [route[0][0], route[0][1]]));
  map.fitBounds(b, { padding: 80, pitch: 55, duration: 2500 });
  setTimeout(() => document.getElementById('summary').classList.add('on'), 700);
}
function hideSummary() { document.getElementById('summary').classList.remove('on'); }
document.getElementById('sagain').onclick = () => { hideSummary(); t = 0; camT = null; setPlaying(true); };
document.getElementById('play').onclick = () => { hideSummary(); setPlaying(!playing); };
document.getElementById('speed').onclick = e => {
  const d = t / duration(); speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
  t = d * duration(); e.target.textContent = 'x' + speed;
};
document.getElementById('prog').oninput = e => {
  const d = e.target.value / 1000 * total; t = d / total * duration(); camT = null; update(d, true);
  // cuando termine de cargar el relieve de esa zona, se recoloca la camara por encima de las montañas
  map.once('idle', () => { if (!playing) { camT = null; update(d, true); } });
};
document.getElementById('zout').onclick = () => zoomFollow(1.35);
document.getElementById('zin').onclick = () => zoomFollow(1 / 1.35);
document.getElementById('sat').onclick = () => useStyle('sat');
document.getElementById('topo').onclick = () => useStyle('topo');
function closeViewer() {
  if (bridge) bridge.close();
  else if (window.GPSMap && window.GPSMap.close) window.GPSMap.close();
  else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.gpsmap) window.webkit.messageHandlers.gpsmap.postMessage('close');
  else window.close();
}
document.getElementById('close').onclick = closeViewer;
addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewer();
  if (e.key === ' ' && route) { e.preventDefault(); setPlaying(!playing); }
});
// Avisos visibles si algo falla (nunca una pantalla vacia sin explicacion)
function notice(msg) {
  let n = document.getElementById('notice');
  if (!n) {
    n = document.createElement('div'); n.id = 'notice'; n.className = 'panel';
    n.style.cssText = 'top:70px;right:12px;left:auto;padding:10px 14px;max-width:320px;font-size:14px';
    document.body.appendChild(n);
  }
  n.textContent = msg;
}
window.addEventListener('error', e => { console.error('JS: ' + e.message); notice('Error en la vista 3D: ' + e.message); });
(bridge ? bridge.config().then(t => JSON.parse(t)) : fetch('config.json').then(r => r.json())).then(c => {
  init(c);
  // (las teselas que faltan fuera de la zona de cada ortofoto son normales: no se registran)
  map.on('error', e => { const m = e.error && e.error.message || String(e); if (!/\((400|404)\)/.test(m)) console.error('Mapa: ' + m); });
  map.on('webglcontextlost', () => { console.error('estado3d: contexto WebGL perdido'); notice('La vista 3D se ha reiniciado por falta de memoria gráfica.'); });
  console.info('estado3d: inicio ' + innerWidth + 'x' + innerHeight + ' dpr=' + devicePixelRatio + ' ruta=' + (route ? route.length : 0));
  setTimeout(() => console.info('estado3d: 10s cargado=' + map.loaded() + ' tiles=' + map.areTilesLoaded() + ' zoom=' + map.getZoom().toFixed(1)), 10000);
  // si a los 20 s no hay relieve cargado, se avisa
  let everIdle = false; map.once('idle', () => { everIdle = true; });
  setTimeout(() => { if (!everIdle && !playing) notice(bridge ? 'Cargando el relieve… si no aparece, comprueba la conexión.' : 'Cargando el relieve… si no aparece, comprueba la conexión o descarga la zona en "Offline".'); }, 20000);
}).catch(e => notice('No se pudo abrir la vista 3D: ' + e));
</script>
